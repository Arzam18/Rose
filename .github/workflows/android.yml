name: Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make curl unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-24" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build Rose for Android ARM64 NEON
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          export TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CXX="${TOOLCHAIN}/aarch64-linux-android24-clang++"
          export CC="${TOOLCHAIN}/aarch64-linux-android24-clang"

          make clean || true

          BIN="rose-$(cat src/rose_version.txt)-android-arm64-neon"

          make \
            "$BIN" \
            ARCH=arm64-neon \
            EXE="$BIN" \
            CXX="${CXX}" \
            LDFLAGS="-pthread -static-libstdc++ -Wl,--gc-sections"

          file "$BIN"

      - name: Verify Android ARM64 ELF
        shell: bash
        run: |
          set -eux
          BIN="rose-$(cat src/rose_version.txt)-android-arm64-neon"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:|Machine:|Type:'

      - name: Package single binary
        shell: bash
        run: |
          set -eux
          BIN="rose-$(cat src/rose_version.txt)-android-arm64-neon"
          mkdir -p artifact
          cp "$BIN" "artifact/$BIN"
          chmod +x "artifact/$BIN"

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: rose-android-arm64-neon
          path: artifact/rose-*-android-arm64-neon
          if-no-files-found: error
