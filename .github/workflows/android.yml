name: Rose Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # HOST TOOLS
      # ============================================================
      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            curl \
            unzip \
            file \
            binutils

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -d "$SDK_ROOT"

      # ============================================================
      # LOCATE SDKMANAGER
      # ============================================================
      - name: Locate sdkmanager
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$ANDROID_SDK_ROOT"
          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              head -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # ============================================================
      # ACCEPT LICENSES
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      # ============================================================
      # INSTALL NDK
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

      # ============================================================
      # VERIFY NDK
      # ============================================================
      - name: Verify Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"

          "$TOOLCHAIN/aarch64-linux-android24-clang++" --version

      # ============================================================
      # DOWNLOAD ROSE NETWORK
      # ============================================================
      - name: Download Rose neural network
        shell: bash
        run: |
          set -euxo pipefail

          NETWORK="$(tr -d '[:space:]' < src/rose_network.txt)"

          echo "Rose network: $NETWORK"

          mkdir -p networks

          URL="https://github.com/87flowers/rose-nets/releases/download/${NETWORK}/${NETWORK}.rosenet"
          OUTPUT="networks/${NETWORK}.rosenet"

          echo "Downloading:"
          echo "$URL"

          rm -f "$OUTPUT"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --user-agent "GitHub-Actions-Rose-Android-Build" \
            "$URL" \
            --output "$OUTPUT"

          test -s "$OUTPUT"

          echo
          echo "Network downloaded successfully:"
          ls -lh "$OUTPUT"

          echo
          echo "Network size:"
          wc -c "$OUTPUT"

      # ============================================================
      # REPLACE C++26 #EMBED
      #
      # Android NDK 27.2 does not implement #embed.
      #
      # We convert the exact .rosenet bytes into a C++ unsigned-char
      # array and change embedded.hpp to match.
      #
      # The neural network therefore remains INSIDE the executable.
      # ============================================================
      - name: Generate Android embedded network source
        shell: bash
        run: |
          set -euxo pipefail

          NETWORK="$(tr -d '[:space:]' < src/rose_network.txt)"
          NETWORK_FILE="networks/${NETWORK}.rosenet"

          test -s "$NETWORK_FILE"

          python3 <<'PY'
          from pathlib import Path

          network_name = Path("src/rose_network.txt").read_text().strip()
          network_file = Path("networks") / f"{network_name}.rosenet"

          embedded_cpp = Path("src/rose/eval/nnue/embedded.cpp")
          embedded_hpp = Path("src/rose/eval/nnue/embedded.hpp")

          data = network_file.read_bytes()

          print(f"Embedding {len(data):,} bytes")
          print(f"Network: {network_file}")

          # --------------------------------------------------------
          # Change the declaration from char[] to unsigned char[].
          # This allows every byte 0x00..0xFF to be represented
          # without narrowing-conversion problems.
          # --------------------------------------------------------
          hpp = embedded_hpp.read_text()

          old_decl = (
              "alignas(EmbeddedNetwork) extern const char "
              "g_embedded_network_raw[];"
          )

          new_decl = (
              "alignas(EmbeddedNetwork) extern const unsigned char "
              "g_embedded_network_raw[];"
          )

          if old_decl not in hpp:
              raise SystemExit(
                  "Could not find the original g_embedded_network_raw declaration"
              )

          hpp = hpp.replace(old_decl, new_decl)

          embedded_hpp.write_text(hpp)

          # --------------------------------------------------------
          # Generate the C++ byte array.
          # --------------------------------------------------------
          with embedded_cpp.open("w", newline="\n") as f:
              f.write('#include "rose/eval/nnue/embedded.hpp"\n\n')
              f.write("namespace rose::eval::nnue {\n\n")
              f.write(
                  "  alignas(EmbeddedNetwork) "
                  "const unsigned char g_embedded_network_raw[] = {\n"
              )

              for i in range(0, len(data), 16):
                  chunk = data[i:i + 16]
                  values = ", ".join(f"0x{b:02X}" for b in chunk)
                  f.write(f"    {values},\n")

              f.write("  };\n\n")
              f.write("}  // namespace rose::eval::nnue\n")

          print(f"Generated: {embedded_cpp}")
          print(f"Generated: {embedded_hpp}")

          print("Embedded source size:")
          print(f"{embedded_cpp.stat().st_size:,} bytes")
          PY

          echo
          echo "Generated embedded.cpp:"
          ls -lh src/rose/eval/nnue/embedded.cpp

          echo
          echo "First lines:"
          sed -n '1,12p' src/rose/eval/nnue/embedded.cpp

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Rose for Android ARM64 NEON
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          echo "========================================"
          echo "Building Rose"
          echo "Version: $VERSION"
          echo "Binary:  $BIN"
          echo "Compiler: $CXX"
          echo "========================================"

          rm -rf build

          make "$BIN" \
            ARCH=arm64-neon \
            EXE="$BIN" \
            CXX="$CXX" \
            CXXFLAGS="-std=c++26 -march=armv8.2-a+simd+dotprod -mtune=cortex-a76" \
            LDFLAGS="-pthread -static-libstdc++ -Wl,--gc-sections"

          test -f "$BIN"

          chmod +x "$BIN"

          echo
          echo "Build completed:"
          ls -lh "$BIN"

      # ============================================================
      # VERIFY ARM64
      # ============================================================
      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          echo "========================================"
          echo "Binary information"
          echo "========================================"

          file "$BIN"

          echo
          echo "ELF header:"

          readelf -h "$BIN" |
            grep -E \
              'Class:|Data:|Type:|Machine:|Entry point'

          echo
          echo "Checking AArch64..."

          file "$BIN" |
            grep -E 'ARM aarch64|ARM64|AArch64'

      # ============================================================
      # CHECK LIBC++
      # ============================================================
      - name: Check runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          echo "Dynamic dependencies:"
          readelf -d "$BIN" |
            grep NEEDED || true

          echo
          echo "Checking libc++_shared.so..."

          if readelf -d "$BIN" |
            grep -q 'libc++_shared.so'; then

            echo "ERROR: binary still requires libc++_shared.so"
            exit 1
          fi

          echo "OK: no libc++_shared.so dependency."

      # ============================================================
      # VERIFY NETWORK IS INSIDE BINARY
      # ============================================================
      - name: Verify embedded network
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          NETWORK="$(tr -d '[:space:]' < src/rose_network.txt)"
          NETWORK_FILE="networks/${NETWORK}.rosenet"

          NETWORK_SIZE="$(wc -c < "$NETWORK_FILE")"
          BINARY_SIZE="$(wc -c < "$BIN")"

          echo "Network size: $NETWORK_SIZE bytes"
          echo "Binary size:  $BINARY_SIZE bytes"

          if [ "$BINARY_SIZE" -le "$NETWORK_SIZE" ]; then
            echo "WARNING: binary is not larger than the network."
            echo "This may indicate the network was not embedded."
          else
            echo "OK: binary contains substantial embedded network data."
          fi

          echo
          echo "Embedded network source compiled successfully."

      # ============================================================
      # PREPARE ONE FILE ONLY
      # ============================================================
      - name: Prepare single binary artifact
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          rm -rf artifact
          mkdir -p artifact

          cp "$BIN" "artifact/$BIN"
          chmod +x "artifact/$BIN"

          echo "Final artifact:"
          ls -lah artifact

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload Android ARM64 NEON binary
        uses: actions/upload-artifact@v4
        with:
          name: rose-android-arm64-neon
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
