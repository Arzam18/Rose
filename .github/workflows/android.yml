name: Rose Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # HOST TOOLS
      # ------------------------------------------------------------
      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            curl \
            unzip \
            file \
            binutils

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -d "$SDK_ROOT"

      # ------------------------------------------------------------
      # FIND SDKMANAGER
      # ------------------------------------------------------------
      - name: Locate sdkmanager
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$ANDROID_SDK_ROOT"
          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"

          else
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              head -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # ------------------------------------------------------------
      # ACCEPT LICENSES
      # ------------------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      # ------------------------------------------------------------
      # INSTALL NDK
      # ------------------------------------------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

      # ------------------------------------------------------------
      # VERIFY NDK
      # ------------------------------------------------------------
      - name: Verify Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"

          "$TOOLCHAIN/aarch64-linux-android24-clang++" --version

      # ------------------------------------------------------------
      # DOWNLOAD ROSE NNUE NETWORK
      #
      # IMPORTANT:
      # Rose's Makefile normally downloads the network itself.
      # We download it here first so the Makefile sees the file
      # already present and does not get stuck at 0%.
      # ------------------------------------------------------------
      - name: Download Rose neural network
        shell: bash
        run: |
          set -euxo pipefail

          NETWORK="$(tr -d '[:space:]' < src/rose_network.txt)"

          echo "Rose network: $NETWORK"

          mkdir -p networks

          URL="https://github.com/87flowers/rose-nets/releases/download/${NETWORK}/${NETWORK}.rosenet"
          OUTPUT="networks/${NETWORK}.rosenet"

          echo "Downloading:"
          echo "$URL"
          echo "To:"
          echo "$OUTPUT"

          rm -f "$OUTPUT"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --user-agent "GitHub-Actions-Rose-Android-Build" \
            "$URL" \
            --output "$OUTPUT"

          test -s "$OUTPUT"

          echo
          echo "Downloaded network:"
          ls -lh "$OUTPUT"

          echo
          echo "Network size:"
          wc -c "$OUTPUT"

          echo
          echo "Network file:"
          file "$OUTPUT"

      # ------------------------------------------------------------
      # BUILD ROSE
      # ------------------------------------------------------------
      - name: Build Rose for Android ARM64 NEON
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"

          BIN="rose-${VERSION}-android-arm64-neon"

          echo "========================================"
          echo "Building Rose"
          echo "Version: $VERSION"
          echo "Binary:  $BIN"
          echo "Compiler: $CXX"
          echo "========================================"

          rm -rf build

          make "$BIN" \
            ARCH=arm64-neon \
            EXE="$BIN" \
            CXX="$CXX" \
            CXXFLAGS="-std=c++26 -march=armv8.2-a+simd+dotprod -mtune=cortex-a76" \
            LDFLAGS="-pthread -static-libstdc++ -Wl,--gc-sections"

          test -f "$BIN"

          chmod +x "$BIN"

          echo
          echo "Build completed:"
          ls -lh "$BIN"

      # ------------------------------------------------------------
      # VERIFY ARM64
      # ------------------------------------------------------------
      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          echo "========================================"
          echo "Binary information"
          echo "========================================"

          file "$BIN"

          echo
          echo "ELF header:"
          readelf -h "$BIN" |
            grep -E \
              'Class:|Data:|Type:|Machine:|Entry point'

          echo
          echo "Checking AArch64..."

          file "$BIN" |
            grep -E 'ARM aarch64|ARM64|AArch64'

      # ------------------------------------------------------------
      # CHECK DYNAMIC DEPENDENCIES
      # ------------------------------------------------------------
      - name: Check runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          echo "========================================"
          echo "Dynamic dependencies"
          echo "========================================"

          readelf -d "$BIN" |
            grep NEEDED || true

          echo
          echo "Checking for libc++_shared.so..."

          if readelf -d "$BIN" |
            grep -q 'libc++_shared.so'; then

            echo "ERROR:"
            echo "Binary still requires libc++_shared.so"
            exit 1
          fi

          echo "OK: libc++_shared.so is not required."

      # ------------------------------------------------------------
      # CHECK ROSE NETWORK WAS EMBEDDED
      # ------------------------------------------------------------
      - name: Verify embedded network object
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          NETWORK="$(tr -d '[:space:]' < src/rose_network.txt)"
          NETWORK_FILE="networks/${NETWORK}.rosenet"

          echo "Network used:"
          echo "$NETWORK"

          echo
          echo "Network file:"
          ls -lh "$NETWORK_FILE"

          echo
          echo "Binary size:"
          ls -lh "$BIN"

          echo
          echo "Embedded network object:"
          strings "$BIN" |
            grep -F "$NETWORK" ||
            true

          echo
          echo "Network was supplied to embedded.cpp during compilation."

      # ------------------------------------------------------------
      # PREPARE SINGLE-BINARY ARTIFACT
      # ------------------------------------------------------------
      - name: Prepare single binary artifact
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(tr -d '[:space:]' < src/rose_version.txt)"
          BIN="rose-${VERSION}-android-arm64-neon"

          rm -rf artifact
          mkdir -p artifact

          cp "$BIN" "artifact/$BIN"

          chmod +x "artifact/$BIN"

          echo "Artifact contents:"
          ls -lah artifact

      # ------------------------------------------------------------
      # UPLOAD ONLY THE ENGINE BINARY
      # ------------------------------------------------------------
      - name: Upload Android ARM64 NEON binary
        uses: actions/upload-artifact@v4
        with:
          name: rose-android-arm64-neon
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
